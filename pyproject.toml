[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ants-rl"
version = "0.2.0"
description = "Partially observable maze foraging with PPO: memory, layout diversity and reward shaping"
authors = [{ name = "Bishwaswarup", email = "bishwaswarup@iisc.ac.in" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29", "stable-baselines3>=2.3", "sb3-contrib>=2.3", "torch>=2.1",
  "numpy>=1.24", "pyyaml>=6.0", "pandas>=2.0", "matplotlib>=3.7", "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
viz = ["pygame>=2.5"]

[tool.setuptools]
packages = ["ants_rl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
