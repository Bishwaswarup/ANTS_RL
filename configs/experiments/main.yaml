# E1 - Memory architecture x layout diversity (the main result).
# Reactive + frame-stack agents: 2 memory types x 5 pool sizes x 5 seeds = 50 runs.
# LSTM runs are ~7x slower and live in main_lstm.yaml (same output folder).
name: main
seeds: [0, 1, 2, 3, 4]
fixed:
  env.reward.preset: pbrs
grid:
  agent.memory: [none, stack]
  env.n_train_mazes: [1, 8, 64, 512, 0]   # 0 = fresh layout every episode
