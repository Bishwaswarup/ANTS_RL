# ============================================================
#  ANTS-RL default configuration (single source of truth).
#  Every run writes its fully-resolved config to <run_dir>/config.yaml.
#  Override from the CLI:  python scripts/train.py --set agent.memory=lstm
# ============================================================

seed: 0

env:
  width: 11
  height: 11
  obs_window: 3            # agent sees a (2k+1)x(2k+1) egocentric patch
  min_food_dist: 3         # minimum *geodesic* nest->food distance
  max_steps: null          # null -> 6 x (#free cells) = 294 for 11x11
  n_train_mazes: 0         # 0 = fresh layout every episode; N>0 = fixed pool of N layouts
  maze_seed_base: 0
  maze_algorithm: dfs      # dfs | prim
  reward:
    preset: pbrs           # sparse | pbrs | legacy (see ants_rl/env.py)

agent:
  memory: stack            # none | stack | lstm
  n_stack: 4               # frames, used when memory=stack
  extractor: cnn           # cnn | attention
  features_dim: 64
  lstm_hidden: 64          # used when memory=lstm

ppo:
  total_timesteps: 1000000
  n_envs: 8
  learning_rate: 3.0e-4
  n_steps: 256             # per env per update (rollout = n_envs * n_steps)
  batch_size: 256
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  device: cpu

eval:
  n_episodes: 500          # held-out layouts for the final evaluation
  n_train_episodes: 200    # episodes from the training layout distribution
  curve_every: 50000       # env steps between learning-curve evaluations
  curve_episodes: 100      # held-out episodes per learning-curve point
  modes: [deterministic, stochastic]
  transfer_sizes: [15, 21] # extra held-out evals on larger mazes (same window)

output:
  root: runs
  save_model: true
  tensorboard: false
